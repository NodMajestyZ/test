<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Field Guide — Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0E16;
    --card:#151A26;
    --line:#232B3A;
    --text:#E9ECF3;
    --muted:#8B93A6;
    --supervised:#F2B705;
    --unsupervised:#E8577A;
    --deep:#5B7CFA;
    --reinforce:#34D9A0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #16203a 0%, transparent 60%),
      var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:40px 24px;
  }
  .card{
    max-width:640px;
    width:100%;
    text-align:center;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    letter-spacing:.18em;
    color:var(--muted);
    text-transform:uppercase;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(30px,5vw,44px);
    line-height:1.15;
    margin:16px 0 14px;
  }
  h1 span{
    background:linear-gradient(90deg,#F2B705,#E8577A 38%,#5B7CFA 68%,#34D9A0);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  p.desc{
    color:var(--muted);
    font-size:15.5px;
    line-height:1.7;
    margin-bottom:36px;
  }
  .dots{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:30px;
  }
  .dots span{
    width:9px; height:9px; border-radius:50%;
  }
  .dots span:nth-child(1){background:var(--supervised);}
  .dots span:nth-child(2){background:var(--unsupervised);}
  .dots span:nth-child(3){background:var(--deep);}
  .dots span:nth-child(4){background:var(--reinforce);}

  a.enter{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--text);
    text-decoration:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:14px 28px;
    border-radius:100px;
    transition:transform .18s ease, border-color .18s ease;
  }
  a.enter:hover{
    transform:translateY(-2px);
    border-color:var(--deep);
  }
  a.enter .arrow{transition:transform .18s ease;}
  a.enter:hover .arrow{transform:translateX(3px);}

  footer{
    margin-top:44px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.05em;
    color:var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Machine Learning — Field Guide</div>
    <h1>สายพันธุ์ของ<br><span>Machine Learning Algorithms</span></h1>
    <p class="desc">แผนภูมิจัดหมวดหมู่อัลกอริทึม ML 12 แบบ แบ่งตาม Supervised, Unsupervised, Deep Learning และ Reinforcement Learning</p>
    <div class="dots"><span></span><span></span><span></span><span></span></div>
    <a class="enter" href="ml-algorithms.html">เข้าดูแผนภูมิ <span class="arrow">→</span></a>
    <footer>MADE WITH CLAUDE · ML ALGORITHM FIELD GUIDE</footer>
  </div>
</body>
</html>
